name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: python3 tests/test_release_metadata.py

  apk:
    permissions:
      contents: write
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: production
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner already has an Android SDK and accepted licenses.
      # AGP installs any missing pinned NDK/build-tools from that SDK as needed.
      - name: Check Android SDK
        run: test -d "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile --prod=false
      - name: Prepare signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/prepare-ci-signing.py
      - name: Set app version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            CODE=$(python3 scripts/release-metadata.py --version "$VERSION")
          else
            VERSION="$(node -p 'require("./package.json").version')-preview.$GITHUB_RUN_NUMBER"
            CODE="$GITHUB_RUN_NUMBER"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Build standalone APK
        shell: bash
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest assembleRelease --no-daemon --max-workers 2 -PkryptosVersionCode="${{ steps.version.outputs.code }}" -PkryptosVersionName="${{ steps.version.outputs.name }}" 2>&1 | tee gradle-build.log
      - name: Report build failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('android/gradle-build.log')
          if log.exists():
              tail = log.read_text(errors='replace')[-9000:]
              # GitHub truncates long annotations; keep the final error visible.
              for index in range(0, len(tail), 2500):
                  message = tail[index:index + 2500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Android build failure::' + message)
          PY
      - name: Package APK
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/KryptosMobile-${SIGNING_MODE}.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/release-metadata.py --version "${GITHUB_REF_NAME#v}" --apk dist/KryptosMobile-release.apk --output dist/update-manifest.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: KryptosMobile-${{ steps.signing.outputs.mode }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Remove signing material
        if: always()
        run: rm -f android/app/ci-signing.keystore android/keystore.properties
